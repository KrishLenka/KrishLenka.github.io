<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Krish Lenka</title>

	<link rel="stylesheet" href="css/styles.css">
</head>

<body>

	<!-- Header -->
	<header class="header">
		<!-- Sidebar toggling button -->
		<button class="menu-button" type="button" aria-label="Toggle sidebar" aria-expanded="false">
			<svg class="sidebar-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
				<rect class="sidebar-icon-fill" x="1.5" y="1.5" width="5" height="15" rx="1.5" /> <!-- rectangle to fill button -->
				<rect x="1.5" y="1.5" width="15" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1" /> <!-- rectangle to unfill button -->
				<line x1="6.5" y1="1.5" x2="6.5" y2="16.5" stroke="currentColor" stroke-width="1" /> <!-- line to create side toggle visual-->
			</svg>
		</button>
		<nav class="header-nav" aria-label="Primary">
			<a href="#hero">About Me</a>
			<a href="#projects">Projects</a>
			<a href="#experience">Experience</a>
			<a href="#contact">Contact</a>
		</nav>
		<button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
			<div class="toggle-track">
				<div class="toggle-thumb"></div>
			</div>
		</button>
	</header>
	<div class="side-nav" id="sideNav">
		<p class="side-nav-placeholder">content coming soon...</p>
	</div>

	<main class="main-content" id="mainContent">
		<section class="section hero" id="hero">
			<div class="grid-rule-wrap">
				<hr class="grid-rule">
				<span class="grid-num">01</span>
			</div>
			<div class="section-body">
				<h1 class="display">
					KRISH LENKA
				</h1>
				<div class="hero-sub">
					<span class="sub">Computer Science Student</span>
					<span class="sub">Software Engineer</span>
					<span class="sub">AI & ML Engineer</span> 
					<span class="sub">Mobile App Developer</span>
				</div>
			</div>
		</section>

		<section class="section" id="projects">
			<div class="grid-rule-wrap">
				<hr class="grid-rule">
				<span class="grid-num">02</span>
			</div>
			<div class="section-body">
				<h2 class="display display--section">PROJECTS</h2>
			</div>
		</section>

		<section class="section" id="experience">
			<div class="grid-rule-wrap">
				<hr class="grid-rule">
				<span class="grid-num">03</span>
			</div>
			<div class="section-body">
				<h2 class="display display--section">EXPERIENCE</h2>
			</div>
		</section>

		<section class="section" id="contact">
			<div class="grid-rule-wrap">
				<hr class="grid-rule">
				<span class="grid-num">04</span>
			</div>
			<div class="section-body">
				<h2 class="display display--section">CONTACT</h2>
			</div>
		</section>

	</main>

	<script src="js/main.js"></script>

</body>
</html>
